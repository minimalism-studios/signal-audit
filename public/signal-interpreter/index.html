<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Signal Audit Platform</title>

  <link
    rel="stylesheet"
    href="/signal-interpreter/styles.css"
  >

</head>

<body>
  <div
    class="product-shell"
    data-sidebar-state="expanded"
  >
    <aside
      id="application-sidebar"
      class="application-sidebar"
      aria-label="Signal Audit navigation"
    >
      <header class="application-sidebar__header">
        <div class="application-brand">
          <div
            class="application-brand__mark"
            aria-hidden="true"
          >
            SA
          </div>

          <div class="application-brand__copy">
            <strong>Signal Audit</strong>

            <span>
              Intelligence Platform
            </span>
          </div>
        </div>

        <button
          id="sidebar-toggle"
          class="sidebar-toggle"
          type="button"
          aria-label="Collapse navigation"
          aria-expanded="true"
          aria-controls="application-sidebar"
        >
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="m15 18-6-6 6-6"
            ></path>
          </svg>
        </button>
      </header>

      <nav
        class="product-navigation"
        aria-label="Signal Audit workspaces"
      >
        <button
          class="product-navigation__item"
          type="button"
          data-workspace="dashboard"
          data-tooltip="Dashboard"
        >
          <span
            class="product-navigation__icon"
            aria-hidden="true"
          >
            <svg viewBox="0 0 24 24">
              <rect
                x="3"
                y="3"
                width="7"
                height="7"
                rx="1"
              ></rect>

              <rect
                x="14"
                y="3"
                width="7"
                height="7"
                rx="1"
              ></rect>

              <rect
                x="3"
                y="14"
                width="7"
                height="7"
                rx="1"
              ></rect>

              <rect
                x="14"
                y="14"
                width="7"
                height="7"
                rx="1"
              ></rect>
            </svg>
          </span>

          <span class="product-navigation__label">
            Dashboard
          </span>
        </button>

        <button
          class="product-navigation__item is-active"
          type="button"
          data-workspace="live-signals"
          data-tooltip="Live Signals"
          aria-current="page"
        >
          <span
            class="product-navigation__icon"
            aria-hidden="true"
          >
            <svg viewBox="0 0 24 24">
              <path
                d="M3 12h4l2-6 4 12 2-6h6"
              ></path>
            </svg>
          </span>

          <span class="product-navigation__label">
            Live Signals
          </span>
        </button>

        <button
          class="product-navigation__item"
          type="button"
          data-workspace="investigations"
          data-tooltip="Investigations"
        >
          <span
            class="product-navigation__icon"
            aria-hidden="true"
          >
            <svg viewBox="0 0 24 24">
              <circle
                cx="11"
                cy="11"
                r="7"
              ></circle>

              <path
                d="m20 20-4-4"
              ></path>
            </svg>
          </span>

          <span class="product-navigation__label">
            Investigations
          </span>
        </button>

        <button
          class="product-navigation__item"
          type="button"
          data-workspace="history"
          data-tooltip="Operational Memory"
        >
          <span
            class="product-navigation__icon"
            aria-hidden="true"
          >
            <svg viewBox="0 0 24 24">
              <path
                d="M3 12a9 9 0 1 0 3-6.7"
              ></path>

              <path
                d="M3 4v6h6"
              ></path>

              <path
                d="M12 7v5l3 2"
              ></path>
            </svg>
          </span>

          <span class="product-navigation__label">
            Operational Memory
          </span>
        </button>

        <button
          class="product-navigation__item"
          type="button"
          data-workspace="integrations"
          data-tooltip="Integrations"
        >
          <span
            class="product-navigation__icon"
            aria-hidden="true"
          >
            <svg viewBox="0 0 24 24">
              <path
                d="M8 12h8"
              ></path>

              <path
                d="M12 8v8"
              ></path>

              <rect
                x="3"
                y="3"
                width="6"
                height="6"
                rx="1"
              ></rect>

              <rect
                x="15"
                y="15"
                width="6"
                height="6"
                rx="1"
              ></rect>
            </svg>
          </span>

          <span class="product-navigation__label">
            Integrations
          </span>
        </button>

        <button
          class="product-navigation__item"
          type="button"
          data-workspace="environments"
          data-tooltip="Environments"
        >
          <span
            class="product-navigation__icon"
            aria-hidden="true"
          >
            <svg viewBox="0 0 24 24">
              <path
                d="M12 3 4 7v10l8 4 8-4V7z"
              ></path>

              <path
                d="m4 7 8 4 8-4"
              ></path>

              <path
                d="M12 11v10"
              ></path>
            </svg>
          </span>

          <span class="product-navigation__label">
            Environments
          </span>
        </button>

        <button
          class="product-navigation__item product-navigation__item--settings"
          type="button"
          data-workspace="settings"
          data-tooltip="Settings"
        >
          <span
            class="product-navigation__icon"
            aria-hidden="true"
          >
            <svg viewBox="0 0 24 24">
              <circle
                cx="12"
                cy="12"
                r="3"
              ></circle>

              <path
                d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9A1.7 1.7 0 0 0 21 10h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"
              ></path>
            </svg>
          </span>

          <span class="product-navigation__label">
            Settings
          </span>
        </button>
      </nav>
    </aside>

    <div class="application-content">
      <header class="app-header">
        <div class="workspace-context">
          <p class="product-label">
            Signal Audit Platform
          </p>

          <p
            id="workspace-title"
            class="workspace"
          >
            SIGNAL INTERPRETER
          </p>
        </div>

        <button
          id="refresh-button"
          class="secondary-button"
          type="button"
        >
          Refresh
        </button>

        <button
          id="add-integration-button"
          class="primary-button"
          type="button"
          hidden
        >
          Add Integration
        </button>
      </header>

      <main
        id="live-signals-workspace"
        class="app-layout live-signals-layout"
      >
        <aside class="sidebar">
          <section class="filter-panel">
            <div class="filter-panel__heading">
              <p class="eyebrow">
                Current activity
              </p>

              <h2>Live Signals</h2>
            </div>

            <div class="filter-panel__controls">
<label>
  <span class="filter-label">Source</span>
  <select id="source-filter">
                <option value="">
                  All sources
                </option>

                <option value="grafana">
                  Grafana
                </option>

                <option value="datadog">
                  Datadog
                </option>
              </select>
</label>

            <label>
  <span class="filter-label">State</span>
  <select id="state-filter">
                <option value="">
                  All states
                </option>

                <option value="received">
                  Received
                </option>

                <option value="analyzed">
                  Analyzed
                </option>

                <option value="delivered">
                  Delivered
                </option>

                <option value="failed">
                  Failed
                </option>
              </select>
</label>

            <label>
  <span class="filter-label">Severity</span>
  <select id="severity-filter">
                <option value="">
                  All severities
                </option>

                <option value="critical">
                  Critical
                </option>

                <option value="high">
                  High
                </option>

                <option value="medium">
                  Medium
                </option>

                <option value="low">
                  Low
                </option>

                <option value="informational">
                  Informational
                </option>
              </select>
</label>
            </div>
          </section>

          <div
            id="signal-list"
            class="signal-list"
            aria-live="polite"
          ></div>
        </aside>

        <section
          id="detail-panel"
          class="detail-panel"
        >
          <div class="empty-state">
            <p class="eyebrow">
              Operational intelligence
            </p>

            <h2>Select a signal</h2>

            <p>
              Choose a signal from the list to inspect
              its structured findings.
            </p>
          </div>
        </section>
      </main>

      <section
        id="secondary-workspace"
        class="secondary-workspace"
        hidden
        aria-live="polite"
      ></section>
    </div>
  </div>

  <script
    src="/shared/services/session.js"
    defer
  ></script>

  <script
    src="/shared/auth/permissions.js"
    defer
  ></script>

  <script
    src="/shared/auth/workspaces.js"
    defer
  ></script>

    <script
    src="/shared/api/users.js"
    defer
  ></script>

  <script
    src="/signal-interpreter/workspaces/settings/users.js"
    defer
  ></script>

<script
    src="/signal-interpreter/app.js"
    defer
  ></script>
</body>
</html>
