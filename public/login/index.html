<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-N2RL84FR');</script>
  <!-- End Google Tag Manager -->
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>
    Signal Audit Login
  </title>
  <link
    rel="stylesheet"
    href="/login-assets/styles.css"
  >
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N2RL84FR"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <main class="login">
    <section class="card">
      <h1>
        Signal Audit
      </h1>

      <div
        id="google-auth-section"
        hidden
      >
      <p class="subtitle">
        Sign in to continue.
      </p>

      <div
        id="google-signin"
        aria-label="Sign in with Google"
      ></div>

      <p
        id="google-status"
        class="subtitle"
        hidden
      ></p>

      <div
        class="auth-divider"
        aria-hidden="true"
      >
        <span></span>
        <span>OR</span>
        <span></span>
      </div>

      </div>
      <div
        id="password-fallback"
      >

        <form id="login-form">
          <label>
            Username
            <input
              id="username"
              type="text"
              autocomplete="username"
              required
            >
          </label>

          <label>
            Password
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              required
            >
          </label>

          <button type="submit">
            Sign In
          </button>
        </form>
      </div>

      <p
        id="error"
        class="error"
        role="alert"
        aria-live="polite"
      ></p>
    </section>
  </main>

  <script
    type="module"
    src="/login-assets/app.js"
  ></script>
</body>
</html>
