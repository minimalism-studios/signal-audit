<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Signal Audit Login
  </title>

  <link
    rel="stylesheet"
    href="/login-assets/styles.css"
  >

</head>

<body>

  <main class="login">

    <section class="card">

      <h1>
        Signal Audit
      </h1>

      <p class="subtitle">
        Sign in to continue.
      </p>

      <form id="login-form">

        <label>

          Username

          <input
            id="username"
            type="text"
            autocomplete="username"
            required
          >

        </label>

        <label>

          Password

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
          >

        </label>

        <button type="submit">
          Sign In
        </button>

      </form>

      <p
        id="error"
        class="error"
      ></p>

    </section>

  </main>

  <script
    type="module"
    src="/login-assets/app.js"
  ></script>

</body>

</html>
